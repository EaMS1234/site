<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaMS | {{.Title}}</title>
    <link rel="stylesheet" href="/styles/style.css" id="style">
    <link rel="icon" href="/assets/favicon.ico">

    <script defer src="/scripts/sorting.js"></script>
    <script defer src="/scripts/headings.js"></script>
</head>
<body>
    <header>
        <picture>
            <source srcset="/assets/logo-dark.svg" media="(prefers-color-scheme: dark)">
            <source srcset="/assets/logo-light.svg" media="(prefers-color-scheme: light)">
            <img src="/assets/logo-light.svg" alt="EaMS" style="height: 42px; margin-bottom: 16px;">
        </picture>
        
        <div id="nav">
            <a href="/"><strong>Início</strong></a>
            <a href="/artigos/"><strong>Artigos</strong></a>
            <a href="/galeria/"><strong>Galeria</strong></a>
        </div>
        <hr />
        <a style="float: right;" href="/en/pictures/"><strong>[en]</strong></a>
    </header>

    <main>
        <h1 id="content-title">{{.Title}}</h1>

        <p style="text-align: right;"><a href="./feed.xml">⚛️ Feed</a></p>

        <div id="container" style="display: flex;">
            <div id="list" style="flex: 4;">
                <form action="/galeria/" method="get" style="display: flex;">
                    <input type="text" title="Termo da pesquisa" name="q" required="true" placeholder="Pesquisar..." id="bar" style="flex: 6;" />
                    <div style="flex: 1;"></div>
                    <input type="submit" title="Buscar imagens" value="Pesquisar" id="btn" style="flex: 2;" />
                </form>

                <br />

                {{range .Years}}
                    <div id="year-{{.Year}}">
                        <h2 id="{{.Year}}">{{.Year}}</h2>
                        <hr />

                        <div class="grid-gallery" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px;">
                        {{range .Pictures}}
                            <div>
                                <a href="/galeria/{{.Name}}">
                                    <img class="img-gallery" src="/assets/images/{{.FileName}}" alt="{{.Title}}">
                                    <h3 id="content-title">{{.Title}}</h3>
                                </a>
                                <p>{{.TimeString}}</p>
                                <p class="desc"><i>{{.Desc}}</i><p>
                            </div>
                        {{end}}
                        </div>
                    </div>
                {{end}}
            </div>

            <div id="years" style="flex: 1; text-align: right;">
                {{range .Years}}
                <a href="#{{.Year}}">{{.Year}}</a>
                {{end}}
            </div>
        </div>

        <hr />
    </main>

    <footer>
        © 2025-2026 Erick Augusto
        <br /><br />
        <a href="https://github.com/eams1234/site">GitHUB</a> |
        <a href="mailto:contato@eams.dev.br">E-Mail</a> |
        <a href="https://www.linkedin.com/in/eams1234/">LinkedIn</a> |
        <a href="https://instagram.com/eams1234">Instagram</a>
    </footer>
</body>
</html>
