<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EaMS | {{.Title}}</title>
    <link rel="stylesheet" href="/styles/style.css" id="style">
    <link rel="icon" href="/assets/favicon.ico">
</head>
<body>
    <header>
        <picture>
            <source srcset="/assets/logo-dark.svg" media="(prefers-color-scheme: dark)">
            <source srcset="/assets/logo-light.svg" media="(prefers-color-scheme: light)">
            <img src="/assets/logo-light.svg" alt="EaMS" style="height: 42px; margin-bottom: 16px;">
        </picture>
        
        <div id="nav">
            <a href="/en/"><strong>Home</strong></a>
            <a href="/en/blog/"><strong>Blog</strong></a>
            <a href="/en/pictures/"><strong>Pictures</strong></a>
        </div>
        <hr />
        <a style="float: right;" href="/galeria/{{.Alt}}"><strong>[pt-br]</strong></a>
    </header>

    <main>
        <h1 id="content-title">{{.Title}}</h1>
        <p><i>{{.TimeString}}</i></p>

        <br />

        <div style="text-align: center;">
        <img src="/assets/images/{{.FileName}}" alt="{{.Title}}" style="max-width: 100%; height: auto;">
        </div>

        {{.Content}}

        <br />

        <div style="text-align: center;" ><a onclick="history.back()">Go back</a></div>
    </main>

    <footer>
        <hr />
        © 2025-2026 Erick Augusto
        <br /><br />
        <a href="https://github.com/eams1234/site">GitHUB</a> |
        <a href="mailto:contato@eams.dev.br">E-Mail</a> |
        <a href="https://www.linkedin.com/in/eams1234/">LinkedIn</a> |
        <a href="https://instagram.com/eams1234">Instagram</a>
    </footer>

    <script src="/scripts/headings.js"></script>
</body>
</html>
